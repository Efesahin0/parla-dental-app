apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parla-backend-hpa
  namespace: parla-dental
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parla-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parla-frontend-hpa
  namespace: parla-dental
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parla-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
