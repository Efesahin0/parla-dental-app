apiVersion: v1
kind: Secret
metadata:
  name: parla-backend-secret
  namespace: parla-dental
type: Opaque
stringData:
  # Replace this with the Cloud SQL PostgreSQL connection string if you use Cloud SQL instead of in-cluster PostgreSQL.
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/parla_dental"
  JWT_SECRET: "replace-with-a-long-random-secret"
  ADMIN_PASSWORD: "replace-admin-password"
  DENTIST_PASSWORD: "replace-dentist-password"
  GOOGLE_PLACES_API_KEY: ""
  GOOGLE_PLACE_ID: ""
