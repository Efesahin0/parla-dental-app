apiVersion: v1
kind: Secret
metadata:
  name: parla-backend-secret
  namespace: parla-dental
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE_DB_USER:REPLACE_DB_PASSWORD@parla-postgres-service:5432/parla_dental"
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_JWT_SECRET"
  ADMIN_PASSWORD: "REPLACE_WITH_ADMIN_PASSWORD"
  DENTIST_PASSWORD: "REPLACE_WITH_DENTIST_PASSWORD"
  GOOGLE_PLACES_API_KEY: ""
  GOOGLE_PLACE_ID: ""
