apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parla-redis-pvc
  namespace: parla-dental
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parla-redis
  namespace: parla-dental
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parla-redis
  template:
    metadata:
      labels:
        app: parla-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: parla-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: parla-redis-service
  namespace: parla-dental
spec:
  selector:
    app: parla-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
