apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parla-postgres-pvc
  namespace: parla-dental
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parla-postgres
  namespace: parla-dental
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parla-postgres
  template:
    metadata:
      labels:
        app: parla-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: parla-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: parla-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: parla-postgres-service
  namespace: parla-dental
spec:
  selector:
    app: parla-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
