apiVersion: apps/v1
kind: Deployment
metadata:
  name: parla-frontend
  namespace: parla-dental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parla-frontend
  template:
    metadata:
      labels:
        app: parla-frontend
    spec:
      containers:
        - name: frontend
          image: parla-dental-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: parla-frontend-service
  namespace: parla-dental
spec:
  selector:
    app: parla-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
