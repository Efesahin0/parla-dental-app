apiVersion: apps/v1
kind: Deployment
metadata:
  name: parla-backend
  namespace: parla-dental
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parla-backend
  template:
    metadata:
      labels:
        app: parla-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
    spec:
      containers:
        - name: backend
          image: parla-dental-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: BUILD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: parla-config
            - secretRef:
                name: parla-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parla-backend-service
  namespace: parla-dental
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "4000"
spec:
  selector:
    app: parla-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
